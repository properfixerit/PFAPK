<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Exam অ্যাপ ডাউনলোড করুন অথবা QR কোড স্ক্যান করে ইনস্টল করুন।"
    />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Exam অ্যাপ ডাউনলোড</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, sans-serif;
        color: #172033;
        background: #f5f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 460px);
        padding: clamp(24px, 6vw, 40px);
        border: 1px solid #e4e8f0;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(28 43 73 / 8%);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #52627d;
        font-size: 0.9rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 6vw, 2.25rem);
        line-height: 1.3;
      }

      .version {
        display: inline-block;
        margin: 14px 0 22px;
        padding: 5px 12px;
        border-radius: 999px;
        background: #edf4ff;
        color: #174ea6;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .qr {
        display: block;
        width: min(100%, 280px);
        height: auto;
        margin: 0 auto 14px;
        border: 1px solid #e4e8f0;
        border-radius: 12px;
        background: #fff;
      }

      .hint {
        margin: 0 0 22px;
        color: #52627d;
        line-height: 1.7;
      }

      .download {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px 20px;
        border-radius: 12px;
        background: #155eef;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      .download:hover {
        background: #104dcc;
      }

      .download:focus-visible {
        outline: 3px solid #172033;
        outline-offset: 3px;
      }

      .note {
        margin: 18px 0 0;
        color: #68758c;
        font-size: 0.88rem;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">PF Exam</p>
      <h1>Exam অ্যাপ ইনস্টল করুন</h1>
      <p class="version">সর্বশেষ সংস্করণ 1.1</p>
      <img
        class="qr"
        src="./Exam-QR.png"
        width="300"
        height="300"
        alt="Exam অ্যাপ ডাউনলোড করার QR কোড"
      />
      <p class="hint">অন্য একটি ডিভাইসের ক্যামেরা দিয়ে QR কোডটি স্ক্যান করুন।</p>
      <a
        class="download"
        href="https://raw.githubusercontent.com/properfixerit/PFAPK/main/PFExam/Exam.apk"
        download="Exam.apk"
      >
        Exam.apk ডাউনলোড
      </a>
      <p class="note">
        ডাউনলোডের পর APK ফাইলটি খুলে ইনস্টল করুন। Android চাইলে এই উৎস থেকে ইনস্টলের
        অনুমতি দিন।
      </p>
    </main>
  </body>
</html>
